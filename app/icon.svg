<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" fill="none">
  <defs>
    <!-- Core Gradients using SVG variables -->
    <linearGradient id="zapBlue" x1="10%" y1="10%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="var(--logo-blue, #5B8EFF)" />
      <stop offset="100%" stop-color="var(--logo-blue-hover, #3B82F6)" />
    </linearGradient>
    <linearGradient id="zapViolet" x1="10%" y1="10%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="var(--logo-violet, #A78BFA)" />
      <stop offset="100%" stop-color="var(--logo-violet, #8B5CF6)" stop-opacity="0.8" />
    </linearGradient>
    
    <!-- Ambient Shadow Glow -->
    <filter id="ambientGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    :root {
      --logo-blue: #5B8EFF;
      --logo-blue-hover: #3B82F6;
      --logo-violet: #A78BFA;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --logo-blue: #3D6AFF;
        --logo-blue-hover: #2D5AEF;
        --logo-violet: #7C5CFA;
      }
    }
  </style>

  <!-- Background container glow -->
  <g filter="url(#ambientGlow)">
    <!-- Main Zap path designed with precise modern geometry -->
    <!-- Outer Deep Blue Shadow/Base Segment -->
    <path d="M 290 40 L 150 260 L 240 260 L 170 480 L 370 220 L 280 220 Z" 
          fill="url(#zapBlue)" opacity="0.9" />
          
    <!-- Overlapping Inner Violet/Aero Segment to create a sense of AI and depth -->
    <path d="M 320 60 L 220 220 L 280 220 L 200 440 L 350 200 L 290 200 Z" 
          fill="url(#zapViolet)" opacity="0.95" />
  </g>
</svg>
